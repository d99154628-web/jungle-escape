<!DOCTYPE html>
<html lang="ko">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>헨젤과 그레텔: 과자집 탈출</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Fredoka:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --night:#16241f; --forest:#21362d; --moss:#2f4a3c;
  --cream:#fff4e0; --paper:#fdf0d8; --ink:#3b2416;
  --ginger:#9a5a2b; --caramel:#d9922f; --candy:#ff7fa8; --mint:#7fd6b8;
  --sky:#8fc9ff; --berry:#c2185b; --ok:#2e9e63; --bad:#d84a3a;
  --shadow:0 10px 0 rgba(0,0,0,.18);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  font-family:'Gowun Dodum',sans-serif;color:var(--ink);
  background:
    radial-gradient(1200px 500px at 50% -10%, #2e4d3f 0%, transparent 60%),
    radial-gradient(circle at 10% 90%, #1d3029 0, transparent 40%),
    var(--night);
  background-attachment:fixed;
}
.en{font-family:'Fredoka',sans-serif;font-weight:500}
button{font-family:inherit;cursor:pointer;border:none}
.wrap{max-width:980px;margin:0 auto;padding:16px}

/* 상단바 */
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  background:rgba(255,244,224,.08);border:1px solid rgba(255,244,224,.15);
  border-radius:18px;padding:10px 14px;color:var(--cream);margin-bottom:14px}
.top .who{font-size:18px}
.steps{display:flex;gap:6px;flex:1;justify-content:center}
.step{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;
  background:#3a2b20;color:#b99a7a;font-family:'Fredoka',sans-serif;font-weight:500;font-weight:500;font-size:15px;
  border:3px dashed #6d5340}
.step.done{background:var(--caramel);color:#fff;border:3px solid #ffd59a}
.step.now{border-color:var(--candy);color:var(--candy);background:#4a2734;animation:pulse 1.4s infinite}
@keyframes pulse{50%{transform:scale(1.12)}}
.candy{font-size:16px;white-space:nowrap}

/* 카드 */
.card{background:var(--paper);border-radius:26px;padding:22px;box-shadow:var(--shadow);
  position:relative;border:4px solid #e8c99a}
.scene{display:flex;gap:18px;align-items:center;margin-bottom:16px}
.scene .art{font-size:64px;line-height:1;min-width:96px;text-align:center;
  background:#2b4237;border-radius:22px;padding:14px;box-shadow:inset 0 -6px 0 rgba(0,0,0,.2)}
.scene h2{margin:0 0 6px;font-size:26px;color:var(--ginger)}
.scene p{margin:0;font-size:18px;line-height:1.55}
.narr{background:#fff;border-radius:18px;padding:14px 16px;font-size:18px;line-height:1.6;margin:10px 0}
.witch{background:#3d2347;color:#ffe3f1;border-radius:18px;padding:12px 16px;margin:10px 0;font-size:18px;display:flex;gap:10px;align-items:center}
.witch .en{font-size:20px}
.mission{display:inline-block;background:var(--candy);color:#fff;border-radius:999px;padding:6px 14px;font-size:16px;margin-bottom:10px}

.btn{background:var(--caramel);color:#fff;font-size:20px;padding:12px 22px;border-radius:16px;
  box-shadow:0 5px 0 #a86a17;transition:transform .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #a86a17}
.btn.pink{background:var(--candy);box-shadow:0 5px 0 #c94d78}
.btn.green{background:var(--ok);box-shadow:0 5px 0 #1d6c42}
.btn.ghost{background:#efe0c4;color:var(--ink);box-shadow:0 5px 0 #cdb58f}
.btn:disabled{opacity:.45;cursor:not-allowed}
.listen{background:#4b6cb7;color:#fff;font-size:22px;padding:14px 26px;border-radius:999px;box-shadow:0 5px 0 #2f4a8a}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.center{text-align:center}
.counter{font-size:17px;color:#8a6b4f;margin-bottom:8px}

/* 고르기 */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-top:14px}
.pick{background:#fff;border-radius:20px;padding:14px 8px;font-size:52px;text-align:center;
  border:4px solid #f0dcbc;box-shadow:0 5px 0 #e2c79c;min-height:120px}
.pick small{display:block;font-size:15px;margin-top:6px;color:#8a6b4f}
.pick.ok{border-color:var(--ok);background:#e5f8ee}
.pick.ok small{color:var(--ok);font-family:'Fredoka',sans-serif;font-weight:500;font-weight:500;font-size:16px}
.opt{display:block;width:100%;text-align:left;background:#fff;border:4px solid #f0dcbc;border-radius:16px;
  padding:12px 16px;font-size:20px;margin:8px 0;box-shadow:0 4px 0 #e2c79c}
.opt.ok{border-color:var(--ok);background:#e5f8ee}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.pop{animation:pop .5s}
@keyframes pop{50%{transform:scale(1.08)}}

/* 대화 */
.chat{display:flex;flex-direction:column;gap:6px;margin:10px 0;max-height:320px;overflow:auto;padding:4px}
.line{display:flex;gap:8px;align-items:flex-start}
.line .who2{min-width:62px;font-size:15px;background:#efe0c4;border-radius:10px;padding:4px 6px;text-align:center}
.line .say{background:#fff;border-radius:14px;padding:6px 12px;font-size:18px;cursor:pointer}
.line.on .say{background:#ffe08a}

/* 숫자 고르기 */
.nums{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0}
.num{width:58px;height:58px;border-radius:16px;background:#fff;border:4px solid #f0dcbc;font-family:'Fredoka',sans-serif;font-weight:500;
  font-weight:500;font-size:24px;color:var(--ink)}
.num.sel{background:var(--candy);color:#fff;border-color:#c94d78}
.unit{padding:10px 18px;border-radius:14px;background:#fff;border:4px solid #f0dcbc;font-size:20px}
.unit.sel{background:#4b6cb7;color:#fff;border-color:#2f4a8a}

/* 타일 */
.tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:8px 0}
.tile{background:#fff;border:4px solid #f0dcbc;border-radius:14px;padding:10px 14px;font-size:20px;
  font-family:'Fredoka',sans-serif;font-weight:500;font-weight:500;color:var(--ink)}
.tile.sel{background:#ffe08a;border-color:var(--caramel)}
.answer-line{background:#fff;border-radius:16px;border:3px dashed #d7b98c;min-height:56px;padding:12px;
  font-size:24px;text-align:center;margin:10px 0}

/* 표 */
table.habit{width:100%;border-collapse:separate;border-spacing:0 8px}
table.habit td{background:#fff;padding:10px;font-size:18px}
table.habit td:first-child{border-radius:14px 0 0 14px;font-size:30px;text-align:center;width:60px}
table.habit td:last-child{border-radius:0 14px 14px 0}
.mini{display:inline-flex;align-items:center;gap:6px}
.mini button{width:38px;height:38px;border-radius:12px;background:#efe0c4;font-size:22px}
.mini b{min-width:38px;text-align:center;font-family:'Fredoka',sans-serif;font-weight:500;font-size:24px}

/* 달력 */
.cal{display:inline-grid;grid-template-columns:repeat(7,30px);gap:3px;background:#fff;padding:8px;border-radius:12px}
.cal span{height:30px;border-radius:6px;background:#f3e6cf;font-size:12px;display:grid;place-items:center}
.cal span.m{background:#ffd0df}

/* 글자 */
.letters{display:flex;gap:10px;justify-content:center;margin:16px 0;flex-wrap:wrap}
.letter{width:66px;height:76px;border-radius:16px;background:linear-gradient(#ffb36b,#e07d22);color:#fff;
  font-family:'Fredoka',sans-serif;font-weight:500;font-weight:500;font-size:40px;display:grid;place-items:center;box-shadow:0 6px 0 #9c4f12}
.slot{width:66px;height:76px;border-radius:16px;border:4px dashed #caa77a;background:#fff8ec;
  font-family:'Fredoka',sans-serif;font-weight:500;font-weight:500;font-size:40px;display:grid;place-items:center;color:var(--ginger)}

/* 로그인 */
.login{max-width:560px;margin:40px auto}
.hero{font-size:84px;text-align:center;margin-bottom:6px}
.title{text-align:center;color:var(--cream);font-size:36px;margin:0}
.sub{text-align:center;color:#d8c4a5;margin:6px 0 20px;font-size:18px}
.field{display:flex;gap:10px;margin:10px 0;align-items:center}
.field label{min-width:70px;font-size:20px}
.field input{flex:1;font-family:inherit;font-size:22px;padding:10px 14px;border-radius:14px;border:3px solid #e8c99a;background:#fff}
.heroes{display:flex;gap:12px;margin:14px 0}
.heroes button{flex:1;background:#fff;border:4px solid #f0dcbc;border-radius:20px;padding:12px;font-size:20px}
.heroes button .f{font-size:52px;display:block}
.heroes button.sel{border-color:var(--candy);background:#ffe9f1}

.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#fff;color:var(--ink);
  border-radius:16px;padding:12px 20px;font-size:20px;box-shadow:0 8px 24px rgba(0,0,0,.35);z-index:9;display:none}
.toast.ok{background:#e5f8ee;color:var(--ok)}
.toast.bad{background:#ffe7e3;color:var(--bad)}
.hint{background:#fff6c9;border-radius:14px;padding:10px 14px;margin-top:10px;font-size:17px}
.gain{position:fixed;inset:0;background:rgba(10,18,15,.75);display:none;place-items:center;z-index:8}
.gain .box{background:var(--paper);border-radius:28px;padding:28px 34px;text-align:center;max-width:420px}
.gain .letter{margin:12px auto;width:96px;height:110px;font-size:64px}
.cert{background:#fffaf0;border:6px double var(--caramel);border-radius:24px;padding:24px;text-align:center}
.cert h2{color:var(--berry);font-size:32px;margin:0 0 4px}
.cert ul{text-align:left;font-size:19px;line-height:1.8}

/* 그림·영상 */
.banner{margin:-6px -6px 14px;border-radius:20px;overflow:hidden;background:#2b4237;box-shadow:inset 0 -6px 0 rgba(0,0,0,.2)}
.banner img{width:100%;height:clamp(180px,30vh,300px);object-fit:cover;object-position:center 40%;display:block}
.banner video{width:100%;max-height:58vh;aspect-ratio:16/9;object-fit:contain;background:#000;display:block}
.cover{border-radius:24px;overflow:hidden;aspect-ratio:16/9;margin:0 auto 14px;max-width:560px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.sub-line{background:#2b2236;color:#ffe9f4;border-radius:16px;padding:12px 16px;font-size:19px;line-height:1.6;margin:8px 0}
.sub-line .en{color:#ffd36b}

@media (max-width:640px){
  .scene{flex-direction:column;text-align:center}
  .step{width:28px;height:28px;font-size:13px}
  .letter,.slot{width:46px;height:56px;font-size:28px}
}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="toast" id="toast"></div>
<div class="gain" id="gain"></div>

<script>
/* ================= 서버 연결 (미리보기 시 브라우저 저장소로 대체) ================= */
const HAS_GAS = typeof google !== 'undefined' && google.script && google.script.run;
function api(fn, ...args){
  if (HAS_GAS){
    return new Promise((res, rej)=>{
      google.script.run.withSuccessHandler(res).withFailureHandler(rej)[fn](...args);
    });
  }
  return Promise.resolve(mockApi(fn, args));
}
function mockApi(fn, args){
  let db = {}; try{ db = JSON.parse(localStorage.getItem('candy_mock')||'{}'); }catch(e){}
  if (fn==='studentLogin'){
    const [cls,num,name,hero] = args; const k = cls+'-'+num;
    if (db[k]) return {resumed:true, data:db[k]};
    db[k] = {key:k,'반':cls,'번호':num,'이름':name,'주인공':hero,'현재방':1,'완료방수':0,'정답':0,'오답':0,'방별오답':{},'내습관':{},'마녀습관':{},'시작':Date.now(),'마지막활동':Date.now(),'탈출시각':'','상태':'탐험 중'};
    try{localStorage.setItem('candy_mock',JSON.stringify(db));}catch(e){}
    return {resumed:false};
  }
  if (fn==='saveProgress'){
    const p = args[0]; const k = p.cls+'-'+p.num; const old = db[k]||{};
    db[k] = {key:k,'반':p.cls,'번호':p.num,'이름':p.name,'주인공':p.hero,'현재방':p.room,'완료방수':p.done,'정답':p.right,'오답':p.wrong,
      '방별오답':p.roomWrong,'내습관':p.myHabits,'마녀습관':p.witchHabits,'시작':old['시작']||Date.now(),'마지막활동':Date.now(),
      '탈출시각':p.escaped?(old['탈출시각']||Date.now()):'','상태':p.escaped?'탈출 성공':'탐험 중'};
    try{localStorage.setItem('candy_mock',JSON.stringify(db));}catch(e){}
    return true;
  }
}

/* ================= 그림·영상 설정 =================
   구글 Flow로 만든 파일을 깃허브 Pages에 올린 주소입니다.
   파일이 아직 없으면 자동으로 이모지 그림이 나와요. */
const MEDIA_BASE = 'https://d99154628-web.github.io/jungle-escape/candy/';
const MEDIA = {
  cover: 'cover.jpg',
  rooms: {1:'room1.jpg', 2:'room2.jpg', 3:'room3.jpg', 4:'room4.jpg', 5:'room5.jpg', 6:'room6.jpg', 7:'room7.jpg'},
  prologue: ['prologue1.mp4','prologue2.mp4','prologue3.mp4','prologue4.mp4'],
  ending: ['ending1.mp4','ending2.mp4','ending3.mp4']
};
const mediaUrl = f => (MEDIA_BASE && f) ? MEDIA_BASE.replace(/\/?$/,'/') + f : '';

/* 그림: 있으면 보여 주고, 없으면 조용히 사라짐 */
function imgBlock(file, cls, onOk){
  const u = mediaUrl(file); if (!u) return '';
  const id = 'm' + Math.random().toString(36).slice(2,8);
  window['__ok_'+id] = onOk || function(){};
  return `<div class="${cls}" id="${id}" style="display:none"><img src="${u}" alt=""
    onload="this.parentNode.style.display='';window['__ok_${id}']()"
    onerror="this.parentNode.remove()"></div>`;
}
/* 영상: 파일이 있으면 재생, 없거나 못 불러오면 onFail(이모지 그림 + 기계 음성) */
function videoBlock(file){
  const u = mediaUrl(file); if (!u) return '';
  return `<div class="banner" id="vb"><video id="vid" src="${u}" playsinline controls preload="auto"></video></div>`;
}
function runVideo(onFail){
  const v = document.getElementById('vid');
  if (!v){ onFail && onFail(); return; }
  let failed = false;
  v.addEventListener('loadeddata', ()=>{ const a = document.querySelector('.scene .art'); if (a) a.style.display = 'none'; });
  v.addEventListener('error', ()=>{ if (failed) return; failed = true;
    const b = document.getElementById('vb'); if (b) b.remove(); onFail && onFail(); });
  const pr = v.play(); if (pr && pr.catch) pr.catch(()=>{});
}

/* ================= 데이터 ================= */
const HABITS = {
  teeth:   {en:'brush your teeth', me:'brush my teeth', ko:'이 닦기',    icon:'🪥', unit:'day'},
  water:   {en:'drink water',      me:'drink water',    ko:'물 마시기',  icon:'💧', unit:'day'},
  hands:   {en:'wash your hands',  me:'wash my hands',  ko:'손 씻기',    icon:'🧼', unit:'day'},
  veg:     {en:'eat vegetables',   me:'eat vegetables', ko:'채소 먹기',  icon:'🥦', unit:'day'},
  library: {en:'go to the library',me:'go to the library',ko:'도서관 가기',icon:'📚', unit:'week'},
  exercise:{en:'exercise',         me:'exercise',       ko:'운동하기',  icon:'🏃', unit:'week'}
};
const HKEYS = ['teeth','water','hands','veg','library','exercise'];
const FREQ = ['','once','twice','three times','four times','five times','six times','seven times','eight times','nine times','ten times'];
const cap = s => s.charAt(0).toUpperCase()+s.slice(1);
const freqText = (n,unit) => cap(FREQ[n]) + ' a ' + unit + '.';
const unitKo = u => u==='day' ? '하루' : '주';

const ROOMS = [
  null,
  {name:'사탕 병 찬장',   letter:'H', art:'🍭', part:'Words'},
  {name:'마녀의 수정구',   letter:'A', art:'🔮', part:'Fun Talk 1'},
  {name:'메아리 우물',     letter:'B', art:'🪣', part:'Listen and Do'},
  {name:'마녀의 주문서',   letter:'I', art:'📜', part:'Practice 1'},
  {name:'마녀와 습관 내기', letter:'T', art:'🧙‍♀️', part:'Play 1'},
  {name:'오븐 앞 마지막 시험',letter:'S', art:'🔥', part:'Check It'},
  {name:'과자집의 큰 문',   letter:'', art:'🚪', part:'Final'}
];

/* ================= 상태 ================= */
const S = {cls:'',num:'',name:'',hero:'gretel',room:1,done:0,right:0,wrong:0,roomWrong:{},myHabits:{},witchHabits:{},escaped:false};
const heroName = () => S.hero==='hansel' ? '헨젤' : '그레텔';
const buddyName = () => S.hero==='hansel' ? '그레텔' : '헨젤';
const heroFace = () => S.hero==='hansel' ? '👦' : '👧';
const buddyFace = () => S.hero==='hansel' ? '👧' : '👦';

let saveChain = Promise.resolve();
function save(log){
  const payload = Object.assign({}, S, {log:log||null});
  saveChain = saveChain.then(()=>api('saveProgress', payload)).catch(()=>{});
}
function record(item, answer, correct){
  if (correct) S.right++; else { S.wrong++; S.roomWrong[S.room]=(S.roomWrong[S.room]||0)+1; }
  save({room:S.room, item:item, answer:String(answer), correct:correct});
  renderTop();
  return correct;
}

/* ================= 소리(TTS) ================= */
let VOICES = [];
function loadVoices(){ VOICES = speechSynthesis.getVoices().filter(v=>/^en(-|_)/i.test(v.lang)); }
if ('speechSynthesis' in window){ loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
const ROLE = {
  W:{pitch:1.0, rate:.88, pref:['Female','Samantha','Google US English','Zira']},
  T:{pitch:1.15,rate:.92, pref:['Google US English','Male','Daniel','David']},
  B:{pitch:1.3, rate:.92, pref:['Male','Daniel','Google UK English Male','David']},
  G:{pitch:1.45,rate:.92, pref:['Female','Samantha','Google US English','Zira']},
  X:{pitch:.55, rate:.82, pref:['Google UK English Female','Female','Samantha']}
};
function pickVoice(role){
  if (!VOICES.length) loadVoices();
  const us = VOICES.filter(v=>/en-US/i.test(v.lang));
  const pool = us.length ? us : VOICES;
  for (const p of ROLE[role].pref){ const v = VOICES.find(v=>v.name.includes(p)); if (v) return v; }
  return pool[0] || null;
}
function speak(text, role){
  role = role || 'W';
  return new Promise(res=>{
    if (!('speechSynthesis' in window)){ res(); return; }
    const u = new SpeechSynthesisUtterance(text);
    const v = pickVoice(role); if (v) u.voice = v;
    u.lang = 'en-US'; u.pitch = ROLE[role].pitch; u.rate = ROLE[role].rate;
    u.onend = res; u.onerror = res;
    try { speechSynthesis.speak(u); } catch(e){ res(); return; }
    setTimeout(res, 2500 + text.length * 120);
  });
}
let playToken = 0;
async function playLines(lines, onLine){
  speechSynthesis.cancel();
  const my = ++playToken;
  for (let i=0;i<lines.length;i++){
    if (my!==playToken) return;
    onLine && onLine(i);
    await speak(lines[i].t, lines[i].r);
    await wait(250);
  }
  onLine && onLine(-1);
}
const wait = ms => new Promise(r=>setTimeout(r,ms));
function stopMedia(){ try{ speechSynthesis.cancel(); }catch(e){} playToken++; const v = document.getElementById('vid'); if (v) v.pause(); }

/* ================= 유틸 ================= */
const $ = s => document.querySelector(s);
const app = $('#app');
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function toast(msg, kind){
  const t = $('#toast'); t.textContent = msg; t.className = 'toast '+(kind||''); t.style.display='block';
  clearTimeout(t._h); t._h = setTimeout(()=>t.style.display='none', 1600);
}
function shakeEl(el){ el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); }
const praise = ()=>shuffle(['Great!','Good job!','Excellent!','Nice!','Wonderful!'])[0];
const oops = ()=>shuffle(['앗, 다시 들어 봐!','아깝다! 한 번 더!','마녀가 킥킥 웃어요… 다시!'])[0];
function seededRand(seed){
  let a = 2166136261; for (const c of seed){ a ^= c.charCodeAt(0); a = Math.imul(a, 16777619) >>> 0; }
  return ()=>{ a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}

function renderTop(){
  const top = $('#top'); if (!top) return;
  let steps = '';
  for (let i=1;i<=7;i++){
    const cls = i<S.room || S.escaped ? 'done' : (i===S.room ? 'now' : '');
    const label = i<7 ? (i<S.room||S.escaped ? ROOMS[i].letter : i) : '🚪';
    steps += `<div class="step ${cls}" title="${ROOMS[i].name}">${label}</div>`;
  }
  top.innerHTML = `<div class="who">${heroFace()} ${S.name} <small style="opacity:.7">(${S.cls}반 ${S.num}번)</small></div>
    <div class="steps">${steps}</div>

}

    speak(question, d.q); $('#pq').onclick = ()=>speak(question, d.q);
    const upd = ()=>{ $('#ans').textContent = (pick.n||'___') + ' ' + (pick.u?'a '+pick.u:'___') + '.'; };
    document.querySelectorAll('#tn .tile').forEach(b=>b.onclick=()=>{ document.querySelectorAll('#tn .tile').forEach(x=>x.classList.remove('sel')); b.classList.add('sel'); pick.n=b.dataset.v; upd(); });
    document.querySelectorAll('#tu .tile').forEach(b=>b.onclick=()=>{ document.querySelectorAll('#tu .tile').forEach(x=>x.classList.remove('sel')); b.classList.add('sel'); pick.u=b.dataset.v; upd(); });
    $('#ok').onclick = async ()=>{
      if (!pick.n || !pick.u){ toast('두 조각을 모두 골라요','bad'); return; }
      const said = pick.n+' a '+pick.u+'.';
      const ok = NUM_V[pick.n]===d.n && pick.u===d.u;
      record('Practice1-'+(k+1)+' '+H.en, said, ok);
      if (ok){ toast(praise(),'ok'); $('#ans').classList.add('pop'); await speak(said, d.a); k++; setTimeout(draw, 500); }
      else { shakeEl($('#ans')); toast(oops(),'bad'); miss++;
        if (miss>=2) $('#hint').innerHTML = `<div class="hint">💡 1=Once, 2=Twice, 3 이상은 ○ times · 하루=a day, 주=a week</div>`; }
    };
  }
  draw();
}

/* ================= 5번 방: Play 1 ================= */
function witchFreq(){
  if (Object.keys(S.witchHabits).length===6 && Object.values(S.witchHabits).every(v=>v.n)) return S.witchHabits;
  const rnd = seededRand(S.cls+'-'+S.num+'-witch'); const w = {};
  HKEYS.forEach(h=>{ const max = HABITS[h].unit==='day'?10:7; w[h] = {n:1+Math.floor(rnd()*max), heard:false}; });
  S.witchHabits = w; return w;
}
function room5(){
  const host = shell(5, intro(
    `드디어 사탕 마녀와 마주쳤어요! 마녀가 내기를 걸어요. "네 습관과 내 습관을 비교해 보자. 내 대답을 정확히 알아들으면 글자를 주지!"`,
    `Let's compare our habits!`) + `<div id="q"></div>`);
  const W = witchFreq();
  // 1단계: 내 습관 쓰기
  function stepMe(){
    HKEYS.forEach(h=>{ if (!S.myHabits[h]) S.myHabits[h] = 1; });
    $('#q').innerHTML = `<div class="mission">1단계 · 나(Me)의 습관을 솔직하게 정해요</div>
      <table class="habit">${HKEYS.map(h=>`<tr><td>${HABITS[h].icon}</td>
        <td><span class="en">How often do you ${HABITS[h].en}?</span><br><small style="color:#8a6b4f">${HABITS[h].ko}</small></td>
        <td style="white-space:nowrap">${unitKo(HABITS[h].unit)}
          <span class="mini"><button data-h="${h}" data-d="-1">−</button><b id="m-${h}">${S.myHabits[h]}</b><button data-h="${h}" data-d="1">+</button></span>회</td></tr>`).join('')}</table>
      <div class="center"><button class="btn pink" id="ok">이제 마녀에게 물어보기 ▶</button></div>`;
    document.querySelectorAll('.mini button').forEach(b=>b.onclick=()=>{
      const h=b.dataset.h; S.myHabits[h]=Math.min(10,Math.max(1,S.myHabits[h]+(+b.dataset.d))); $('#m-'+h).textContent=S.myHabits[h]; });
    $('#ok').onclick = ()=>{ save({room:5,item:'Play1-내 습관',answer:JSON.stringify(S.myHabits),correct:true}); stepAsk(0); };
  }
  // 2단계: 마녀에게 묻고 듣기
  function stepAsk(i){
    if (i>=HKEYS.length){ stepResult(); return; }
    const h = HKEYS[i], H = HABITS[h];
    const right = 'How often do you '+H.en+'?';
    const wrongs = H.en==='exercise'
      ? ['How often you do exercise?','How do you often exercise?']
      : ['How often you do '+H.en+'?','How many do you '+H.en+'?'];
    let phase = 'q', miss = 0;
    $('#q').innerHTML = `<div class="mission">2단계 · 마녀에게 묻기 ${i+1}/6</div>
      <div class="center" style="font-size:60px">🧙‍♀️ ${H.icon}</div>
      <div class="center" style="font-size:18px">마녀에게 <b>${H.ko}</b>를 얼마나 자주 하는지 물어보려면?</div>
      <div id="qq">${shuffle([right].concat(wrongs)).map(o=>`<button class="opt en">${o}</button>`).join('')}</div>
      <div id="aa"></div><div id="hint"></div>`;
    document.querySelectorAll('#qq .opt').forEach(b=>b.onclick=async ()=>{
      if (phase!=='q') return;
      const ok = b.textContent===right;
      record('Play1-질문 '+H.en, b.textContent, ok);
      if (!ok){ shakeEl(b); toast('질문 순서를 다시 봐요!','bad'); return; }
      phase='a'; b.classList.add('ok');
      await speak(right, S.hero==='hansel'?'B':'G');
      const witchSays = freqText(W[h].n, H.unit);
      $('#aa').innerHTML = `<div class="witch">🧙‍♀️ <span class="en">"(쉿… 잘 들어 봐!)"</span>
          <button class="btn ghost" id="wa" style="font-size:16px;padding:6px 12px">🔊 다시 듣기</button></div>
        <div class="center">마녀가 말한 숫자를 마녀(Teacher) 칸에 써요 · ${unitKo(H.unit)}
          <span class="mini"><button id="wm">−</button><b id="wv">1</b><button id="wp">+</button></span>회
          <button class="btn pink" id="wok" style="margin-left:8px">확인</button></div>`;
      let v = 1; const max = 10;
      $('#wm').onclick=()=>{v=Math.max(1,v-1);$('#wv').textContent=v;};
      $('#wp').onclick=()=>{v=Math.min(max,v+1);$('#wv').textContent=v;};
      const hear = ()=>speak(witchSays,'X'); hear(); $('#wa').onclick = hear;
      $('#wok').onclick = ()=>{
        const ok2 = v===W[h].n;
        record('Play1-마녀 대답 '+H.en, unitKo(H.unit)+' '+v+'회', ok2);
        if (ok2){ W[h].heard = true; save();
          const same = S.myHabits[h]===W[h].n;
          toast(same?'⭐ 나랑 똑같아! 별 획득!':praise(), 'ok'); setTimeout(()=>stepAsk(i+1), 900); }
        else { toast(oops(),'bad'); miss++;
          if (miss>=2) $('#hint').innerHTML = `<div class="hint">💡 마녀의 대답: <span class="en">"${witchSays}"</span></div>`; }
      };
    });
  }
  // 3단계: 비교 결과
  function stepResult(){
    const stars = HKEYS.filter(h=>S.myHabits[h]===W[h].n).length;
    $('#q').innerHTML = `<div class="mission">3단계 · 비교 결과</div>
      <table class="habit"><tr><td></td><td><b>습관</b></td><td><b>나 (Me)</b></td><td><b>마녀 (Teacher)</b></td></tr>
      ${HKEYS.map(h=>`<tr><td>${HABITS[h].icon}</td><td>${HABITS[h].ko}</td>
        <td>${unitKo(HABITS[h].unit)} ${S.myHabits[h]}회</td>
        <td>${unitKo(HABITS[h].unit)} ${W[h].n}회 ${S.myHabits[h]===W[h].n?'⭐':''}</td></tr>`).join('')}</table>
      <div class="narr center">마녀와 똑같은 습관 ⭐ <b>${stars}개</b>!<br>
      ${buddyFace()} ${buddyName()}: "마녀가 내기에 져서 화가 났어! 얼른 마지막 시험을 통과하자!"</div>
      <div class="center"><button class="btn pink" id="ok">글자 받기 ✨</button></div>`;
    save({room:5,item:'Play1-별 개수',answer:stars,correct:true});
    $('#ok').onclick = clearRoom;
  }
  if (Object.values(W).every(v=>v.heard)) stepResult(); else stepMe();
}

/* ================= 6번 방: Check It ================= */
function cal(marks){
  const days=['일','월','화','수','목','금','토'];
  return `<div class="cal">${days.map((d,i)=>`<span class="${marks.includes(i)?'m':''}">${marks.includes(i)?'📚':d}</span>`).join('')}</div>`;
}
function room6(){
  const host = shell(6, intro(
    `큰 오븐 앞, 마녀가 마지막 시험을 내요. "두 문제만 맞히면 오븐 뒤의 열쇠를 가져가도 좋아."`,
    `Listen and choose the right picture!`) + `<div id="q"></div>`);
  const QS = [
    {lines:[{t:'How often do you brush your teeth?',r:'B'},{t:'Twice a day.',r:'G'}],
     opts:[`<div style="font-size:60px">👧🪥</div><small>①</small>`, `<div style="font-size:60px">👧🪢</div><small>②</small>`], a:0},
    {lines:[{t:'How often do you go to the library?',r:'G'},{t:'Once a week.',r:'B'}],
     opts:[`${cal([1,3,5])}<small>① 주간 일정표</small>`, `${cal([3])}<small>② 주간 일정표</small>`], a:1}
  ];
  let k = 0;
  function draw(){
    if (k>=QS.length){ setTimeout(clearRoom, 500); return; }
    const Q = QS[k];
    $('#q').innerHTML = `<div class="mission">마지막 시험 ${k+1}/2 · 잘 듣고 알맞은 그림을 골라요</div>
      <div class="center"><button class="listen" id="play">🔊 듣기</button></div>
      <div class="grid" style="grid-template-columns:1fr 1fr">${Q.opts.map((o,i)=>`<button class="pick" data-i="${i}">${o}</button>`).join('')}</div><div id="hint"></div>`;
    const play = ()=>playLines(Q.lines); play(); $('#play').onclick = play;
    let miss = 0;
    document.querySelectorAll('#q .pick').forEach(b=>b.onclick=()=>{
      const ok = +b.dataset.i===Q.a;
      record('CheckIt-'+(k+1), (+b.dataset.i+1)+'번', ok);
      if (ok){ b.classList.add('ok','pop'); toast(praise(),'ok'); k++; setTimeout(draw, 900); }
      else { shakeEl(b); toast(oops(),'bad'); miss++;
        if (miss>=2) $('#hint').innerHTML = `<div class="hint">💡 <span class="en">"${Q.lines[1].t}"</span></div>`; }
    });
  }
  draw();
}

/* ================= 7번: 최종 관문 ================= */
function room7(){
  const word = 'HABITS';
  const host = shell(7, intro(
    `드디어 과자집의 큰 문 앞! 문에는 여섯 칸짜리 자물쇠가 달려 있어요. 모은 글자를 알맞은 순서로 끼워 넣어 <b>'습관'</b>이라는 영어 단어를 만들어요.`,
    `What word do your letters make?`) + `<div id="q"></div>`);
  let pool = shuffle(word.split('').map((c,i)=>({c,i}))); while (pool.map(x=>x.c).join('')===word) pool = shuffle(pool);
  let placed = [];
  function draw(){
    $('#q').innerHTML = `<div class="letters">${[0,1,2,3,4,5].map(i=>`<div class="slot">${placed[i]?placed[i].c:''}</div>`).join('')}</div>
      <div class="letters">${pool.map((p,j)=>`<button class="letter" data-j="${j}" ${placed.includes(p)?'style="opacity:.25" disabled':''}>${p.c}</button>`).join('')}</div>
      <div class="center row" style="justify-content:center"><button class="btn ghost" id="undo">↩ 하나 빼기</button>
      <button class="btn pink" id="ok">🔑 문 열기</button></div><div id="hint"></div>`;
    document.querySelectorAll('#q button.letter').forEach(b=>b.onclick=()=>{ if (placed.length<6){ placed.push(pool[+b.dataset.j]); draw(); } });
    $('#undo').onclick = ()=>{ placed.pop(); draw(); };
    $('#ok').onclick = ()=>{
      const w = placed.map(p=>p.c).join('');
      if (w.length<6){ toast('여섯 글자를 모두 넣어요','bad'); return; }
      const ok = w===word; record('Final-HABITS', w, ok);
      if (ok){ speak('Habits!','G'); escape(); }
      else { toast('문이 꿈쩍도 안 해요…','bad'); placed=[]; draw();
        $('#hint').innerHTML = `<div class="hint">💡 오늘 배운 영어 질문 <span class="en">"What are your <b>h</b>…?"</span> 습관 = h _ _ _ _ s</div>`; }
    };
  }
  draw();
}
function escape(){
  S.escaped = true; S.done = 7; S.room = 7; save({room:7,item:'탈출',answer:'성공',correct:true});
  playEnding(0);
}
function playEnding(i){
  const both = '👧👦 헨젤과 그레텔';
  const pages = [
    {art:'🚪✨🌳', title:'철컥! 문이 열렸어요!',
     t:'여섯 글자가 자물쇠에 딱 맞자 큰 문이 활짝 열렸어요. 마녀는 남매의 좋은 습관에 깜짝 놀랐어요.',
     lines:[{who:'🧙‍♀️ 마녀', t:'Oh no! You have good habits!', r:'X'}]},
    {art:'🥦😊🧙‍♀️', title:'마녀에게 건네는 말',
     t:'남매는 마녀에게 브로콜리를 건네며 말했어요. 마녀는 처음으로 자기 습관을 돌아보았지요.',
     lines:[{who:both, t:'You should eat more vegetables!', r: S.hero==='hansel'?'B':'G'},
            {who:'🧙‍♀️ 마녀', t:"Okay. I'll try.", r:'X'}]},
    {art:'🌅🏡', title:'집으로 가는 길',
     t:'남매는 좋은 습관을 품고 집으로 돌아갔어요. 마녀도 오늘부터 채소를 먹기 시작했대요.', lines:[]}
  ];
  const p = pages[i];
  app.innerHTML = `<div class="top" id="top"></div><div class="card">
    ${videoBlock(MEDIA.ending[i])}
    <div class="scene"><div class="art">${p.art}</div><div><h2 style="color:var(--berry)">${p.title}</h2><p class="counter">${i+1} / ${pages.length}</p></div></div>
    <div class="narr">${p.t}</div>
    ${p.lines.map(l=>`<div class="sub-line">${l.who}: <span class="en">"${l.t}"</span></div>`).join('')}
    <div class="row" style="justify-content:flex-end;margin-top:14px">
      <button class="btn pink" id="next">${i<pages.length-1?'다음 ▶':'탈출 증명서 받기 📜'}</button></div></div>`;
  renderTop();
  window.scrollTo({top:0,behavior:'smooth'});
  runVideo(()=>{ if (p.lines.length) playLines(p.lines); });
  $('#next').onclick = ()=>{ stopMedia(); if (i<pages.length-1) playEnding(i+1); else renderEnding(); };
}
function renderEnding(){
  const habitsList = HKEYS.filter(h=>S.myHabits[h]).map(h=>`<li class="en">I ${HABITS[h].me} ${FREQ[S.myHabits[h]]} a ${HABITS[h].unit}.</li>`).join('');
  app.innerHTML = `<div class="top" id="top"></div><div class="card"><div class="cert">
    <div style="font-size:60px">🏅</div><h2>과자집 탈출 증명서</h2>
    <div style="font-size:20px">${S.cls}반 ${S.num}번 <b>${S.name}</b> (${heroName()})</div>
    <p style="font-size:18px">좋은 습관 글자 <b class="en">H · A · B · I · T · S</b>를 모두 모아<br>사탕 마녀의 과자집을 탈출했습니다!</p>
    <div style="font-size:20px">⭐ 정답 ${S.right}개 &nbsp; 🍬 실수 ${S.wrong}개</div>
    ${habitsList?`<div style="margin-top:14px;font-size:18px">📝 나의 생활 습관</div><ul>${habitsList}</ul>`:''}
    <p style="color:#8a6b4f">선생님 화면에 탈출 기록이 저장되었어요. 짝에게 <span class="en">"How often do you…?"</span> 하고 물어봐요!</p>
    <button class="btn ghost" id="replay">🎬 엔딩 다시 보기</button>
  </div></div>`;
  renderTop();
  $('#replay').onclick = ()=>playEnding(0);
}

renderLogin();
</script>
